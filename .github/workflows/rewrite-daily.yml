name: rewrite-daily

# One shot: rewrite 10 November zodia and eortologio with the new prompts, then delete this workflow.
on:
  push:
    branches: [cursor/rewrite-nov10-daily-6a5a]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AI_PROVIDER: openai
      OPENAI_MODEL: gpt-6.1-sol
      OPENAI_FALLBACK_MODEL: gpt-6.1-terra
      OPENAI_REASONING_EFFORT: low
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTO_BLOG_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r scripts/requirements.txt
      - name: Rewrite zodia and eortologio
        id: rewrite
        run: |
          set -uo pipefail
          failed=0
          for slug in poioi-giortazoyn-simera-triti-10-noemvrioy-2026; do
            python scripts/generate_articles.py --rewrite "$slug" --no-commit || failed=1
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Commit and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.rewrite.outputs.failed }}" = "0" ]; then
            git rm -f .github/workflows/rewrite-daily.yml
          fi
          git add content scripts/state scripts/autoblog/pipeline.py
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit "${{ steps.rewrite.outputs.failed }}"
          fi
          git commit -m "Νέα δομή στα ζώδια και το εορτολόγιο της 10ης Νοεμβρίου."
          git push origin HEAD
          exit "${{ steps.rewrite.outputs.failed }}"
