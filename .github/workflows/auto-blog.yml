name: auto-blog

# Crons are UTC. Which slot each one belongs to, and the Athens hours
# (07:00 for zodia and lifestyle, 09:00, 13:00), live in scripts/autoblog/clock.py.
# GitHub starts these hours late, so each slot also has crons 6–10 hours
# earlier. A run that is more than 40 minutes early exits. One that is close
# waits until the slot. Those early crons only publish within 90 minutes after
# the slot, so an on-time evening start does not publish. The original three
# stay as a late catch-up.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
    - cron: "7 18 * * *"
    - cron: "7 19 * * *"
    - cron: "7 20 * * *"
    - cron: "7 21 * * *"
    - cron: "7 22 * * *"
    - cron: "7 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"
    - cron: "27 0 * * *"
    - cron: "27 1 * * *"
    - cron: "27 2 * * *"
    - cron: "27 3 * * *"
    - cron: "27 4 * * *"
    - cron: "27 5 * * *"
    - cron: "27 10 * * *"
    - cron: "27 11 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Article type"
        required: true
        type: choice
        options: [eortologio, zodia, health, nutrition, news, lifestyle, gossip]
      count:
        description: "How many articles"
        required: true
        default: "1"
      dry_run:
        description: "Generate and validate only (no commit, no push)"
        type: boolean
        default: true
      date:
        description: "Dry-run only: article date YYYY-MM-DD (default: today, Athens)"
        required: false
        default: ""
      rewrite:
        description: "Dry-run only: slugs of existing posts to write again from scratch (space separated)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: vars.AUTO_BLOG_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    env:
      AUTO_BLOG_ENABLED: ${{ vars.AUTO_BLOG_ENABLED }}
      AUTO_BLOG_ENABLED_EORTOLOGIO: ${{ vars.AUTO_BLOG_ENABLED_EORTOLOGIO }}
      AUTO_BLOG_PHASE: ${{ vars.AUTO_BLOG_PHASE || '1' }}
      PUBLISH_MODE_HEALTH: ${{ vars.PUBLISH_MODE_HEALTH || 'pr' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.7-flash' }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      OPENAI_FALLBACK_MODEL: ${{ vars.OPENAI_FALLBACK_MODEL || 'gpt-6.1-terra' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this run is on time
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_DRY: ${{ inputs.dry_run }}
          REWRITE: ${{ inputs.rewrite }}
        run: python3 scripts/publish_gate.py
      - name: Wait until the Athens slot
        if: steps.plan.outputs.proceed == 'true' && steps.plan.outputs.sleep != '0'
        run: |
          case "${{ steps.plan.outputs.sleep }}" in
            ''|*[!0-9]*) echo "bad sleep value"; exit 1 ;;
          esac
          sleep "${{ steps.plan.outputs.sleep }}"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        if: steps.plan.outputs.proceed == 'true'
        run: npm ci
      - name: Install Python dependencies
        if: steps.plan.outputs.proceed == 'true'
        run: pip install -r scripts/requirements.txt
      - name: Self-tests
        if: steps.plan.outputs.proceed == 'true'
        run: |
          npm run publish:check
          python -m unittest discover -s scripts/tests
      - name: Configure git
        if: steps.plan.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
      - name: Generate
        id: gen
        if: steps.plan.outputs.proceed == 'true'
        env:
          DRY_DATE: ${{ inputs.date }}
          REWRITE: ${{ inputs.rewrite }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git fetch origin main
            git checkout -B main origin/main
          fi
          if [ -n "${REWRITE:-}" ]; then
            failed=0
            for s in $REWRITE; do python scripts/generate_articles.py --rewrite "$s" --dry-run || failed=1; done
            exit "$failed"
          fi
          today=$(TZ=Europe/Athens date +%F)
          pr_branch=""
          for t in ${{ steps.plan.outputs.types }}; do
            if [ "${{ steps.plan.outputs.dry }}" = "true" ]; then
              python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}" --dry-run ${DRY_DATE:+--date "$DRY_DATE"}
              continue
            fi
            if { [ "$t" = health ] || [ "$t" = nutrition ]; } && [ "$PUBLISH_MODE_HEALTH" = pr ]; then
              if [ -z "$pr_branch" ]; then
                pr_branch="auto-blog/health-$today-${{ github.run_id }}"
                git checkout -b "$pr_branch" origin/main
              else
                git checkout "$pr_branch"
              fi
              python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}"
              git checkout main
              continue
            fi
            python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}"
          done
          echo "pr_branch=$pr_branch" >> "$GITHUB_OUTPUT"
      - name: Upload dry-run articles
        if: steps.plan.outputs.proceed == 'true' && always() && hashFiles('dry-run/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-articles
          path: dry-run/
      - name: Lint, typecheck, build
        if: steps.plan.outputs.proceed == 'true' && steps.plan.outputs.dry != 'true'
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Push to main
        if: steps.plan.outputs.proceed == 'true' && steps.plan.outputs.dry != 'true'
        run: |
          git checkout main
          if [ "$(git rev-list --count origin/main..main)" = "0" ]; then echo "nothing to push"; exit 0; fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Open PR for health/nutrition
        if: steps.plan.outputs.proceed == 'true' && steps.plan.outputs.dry != 'true' && steps.gen.outputs.pr_branch != ''
        run: |
          branch="${{ steps.gen.outputs.pr_branch }}"
          if [ "$(git rev-list --count origin/main.."$branch")" = "0" ]; then echo "no health article"; exit 0; fi
          git checkout "$branch"
          npm run build
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Άρθρα υγείας/διατροφής για έλεγχο ($(TZ=Europe/Athens date +%F))" \
            --body "Αυτόματα άρθρα σε PR mode (PUBLISH_MODE_HEALTH=pr). Κάντε merge αν είναι εντάξει. Λεπτομέρειες στο scripts/state/runs.jsonl."
