name: auto-blog

# Times are UTC. Athens is UTC+2 in winter (UTC+3 in summer, so runs land one hour later).
on:
  schedule:
    - cron: "0 4 * * *" # 06:00 Athens: eortologio + zodia
    - cron: "0 7 * * *" # 09:00 Athens: health + nutrition
    - cron: "0 11 * * *" # 13:00 Athens: lifestyle (+ news/gossip in phase 2)
  workflow_dispatch:
    inputs:
      type:
        description: "Article type"
        required: true
        type: choice
        options: [eortologio, zodia, health, nutrition, news, lifestyle, gossip]
      count:
        description: "How many articles"
        required: true
        default: "1"
      dry_run:
        description: "Generate and validate only (no commit, no push)"
        type: boolean
        default: true
      provider:
        description: "openai or gemini. default keeps the AI_PROVIDER variable."
        required: false
        default: "default"
        type: choice
        options:
          - default
          - gemini
          - openai
      date:
        description: "Dry-run only: article date YYYY-MM-DD (default: today, Athens)"
        required: false
        default: ""
      rewrite:
        description: "Dry-run only: slugs of existing posts to write again from scratch (space separated)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.AUTO_BLOG_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    env:
      AUTO_BLOG_ENABLED: ${{ vars.AUTO_BLOG_ENABLED }}
      AUTO_BLOG_ENABLED_EORTOLOGIO: ${{ vars.AUTO_BLOG_ENABLED_EORTOLOGIO }}
      AUTO_BLOG_PHASE: ${{ vars.AUTO_BLOG_PHASE || '1' }}
      PUBLISH_MODE_HEALTH: ${{ vars.PUBLISH_MODE_HEALTH || 'pr' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.7-flash' }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider != 'default' && inputs.provider || vars.AI_PROVIDER }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      OPENAI_FALLBACK_MODEL: ${{ vars.OPENAI_FALLBACK_MODEL || 'gpt-6.1-terra' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install -r scripts/requirements.txt
      - name: Self-tests
        run: |
          npm run publish:check
          python -m unittest discover -s scripts/tests
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
      - name: Pick article types
        id: plan
        env:
          REWRITE: ${{ inputs.rewrite }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "types=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
            echo "count=${{ inputs.count }}" >> "$GITHUB_OUTPUT"
            if [ -n "${REWRITE:-}" ]; then echo "dry=true" >> "$GITHUB_OUTPUT"; else echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"; fi
          else
            case "${{ github.event.schedule }}" in
              "0 4 * * *") types="eortologio zodia" ;;
              "0 7 * * *") types="health nutrition" ;;
              *) types="lifestyle news gossip" ;;
            esac
            echo "types=$types" >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate
        id: gen
        env:
          DRY_DATE: ${{ inputs.date }}
          REWRITE: ${{ inputs.rewrite }}
        run: |
          set -euo pipefail
          if [ -n "${REWRITE:-}" ]; then
            failed=0
            for s in $REWRITE; do python scripts/generate_articles.py --rewrite "$s" --dry-run || failed=1; done
            exit "$failed"
          fi
          today=$(TZ=Europe/Athens date +%F)
          pr_branch=""
          for t in ${{ steps.plan.outputs.types }}; do
            if [ "${{ steps.plan.outputs.dry }}" = "true" ]; then
              python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}" --dry-run ${DRY_DATE:+--date "$DRY_DATE"}
              continue
            fi
            if { [ "$t" = health ] || [ "$t" = nutrition ]; } && [ "$PUBLISH_MODE_HEALTH" = pr ]; then
              if [ -z "$pr_branch" ]; then
                pr_branch="auto-blog/health-$today-${{ github.run_id }}"
                git checkout -b "$pr_branch" origin/main
              else
                git checkout "$pr_branch"
              fi
              python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}"
              git checkout main
              continue
            fi
            python scripts/generate_articles.py --type "$t" --count "${{ steps.plan.outputs.count }}"
          done
          echo "pr_branch=$pr_branch" >> "$GITHUB_OUTPUT"
      - name: Upload dry-run articles
        if: always() && hashFiles('dry-run/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-articles
          path: dry-run/
      - name: Lint, typecheck, build
        if: steps.plan.outputs.dry != 'true'
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Push to main
        if: steps.plan.outputs.dry != 'true'
        run: |
          git checkout main
          if [ "$(git rev-list --count origin/main..main)" = "0" ]; then echo "nothing to push"; exit 0; fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Open PR for health/nutrition
        if: steps.plan.outputs.dry != 'true' && steps.gen.outputs.pr_branch != ''
        run: |
          branch="${{ steps.gen.outputs.pr_branch }}"
          if [ "$(git rev-list --count origin/main.."$branch")" = "0" ]; then echo "no health article"; exit 0; fi
          git checkout "$branch"
          npm run build
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Άρθρα υγείας/διατροφής για έλεγχο ($(TZ=Europe/Athens date +%F))" \
            --body "Αυτόματα άρθρα σε PR mode (PUBLISH_MODE_HEALTH=pr). Κάντε merge αν είναι εντάξει. Λεπτομέρειες στο scripts/state/runs.jsonl."
