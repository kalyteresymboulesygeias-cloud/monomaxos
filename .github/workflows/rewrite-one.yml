name: rewrite-one

# One shot: rewrite one 10 November article with the editorial prompt, then delete this workflow.
on:
  push:
    branches: [cursor/rewrite-one-editorial-6a5a]

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AI_PROVIDER: openai
      OPENAI_MODEL: gpt-6.1-sol
      OPENAI_FALLBACK_MODEL: gpt-6.1-terra
      OPENAI_REASONING_EFFORT: low
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTO_BLOG_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r scripts/requirements.txt
      - name: Rewrite one article
        id: rewrite
        run: |
          set -uo pipefail
          python scripts/generate_articles.py --rewrite antiliako-ton-cheimona-pote-echei-noima --no-commit
          echo "failed=$?" >> "$GITHUB_OUTPUT"
      - name: Commit and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.rewrite.outputs.failed }}" = "0" ]; then
            git rm -f .github/workflows/rewrite-one.yml
          fi
          git add content scripts/state
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit "${{ steps.rewrite.outputs.failed }}"
          fi
          git commit -m "Δοκιμή νέας προτροπής στο άρθρο για το αντηλιακό του χειμώνα."
          git push origin HEAD
          exit "${{ steps.rewrite.outputs.failed }}"
